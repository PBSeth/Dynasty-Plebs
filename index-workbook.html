<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17130e">
<title>Dynasty Plebs</title>
<link rel="stylesheet" href="site-v2.css">
<link rel="stylesheet" href="workbook-extras.css">
<link rel="stylesheet" href="production-upgrade.css">
<link rel="stylesheet" href="regression-fix.css?v=1">
</head>
<body>
<header>
  <div class="wrap headbar">
    <a class="brand" href="#"><strong>Dynasty Plebs</strong><small>Est. 2019</small></a>
    <div class="navtabs" aria-label="Dynasty Plebs sections">
      <button class="on" data-view="history">History</button>
      <button data-view="managers">Managers</button>
      <button data-view="drafts">Drafts</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="history">
    <div class="section dp-wall-section"><div class="section-head"><h2>Wall of Fame</h2></div><div class="kpi-grid" id="kpis"></div></div>
    <div class="section"><div class="section-head"><h2>Champions</h2></div><div class="champ-grid" id="champions"></div></div>
    <div class="section"><div class="section-head"><h2>League History</h2></div><div class="panel"><div class="archive-controls" id="historyMetricBtns"></div><div class="archive-chart" id="historyChart"></div></div></div>
    <table id="legacyTable" hidden aria-hidden="true"></table>
  </section>

  <section class="view" id="managers">
    <div class="section-head"><h2>Managers</h2></div>
    <div class="toolbar"><label for="managerSelect">Manager</label><select id="managerSelect"></select></div>
    <div class="manager-grid"><div class="panel manager-card" id="managerProfile"></div><div class="panel"><div class="subhead"><h3>Season History</h3></div><div class="season-list" id="seasonHistory"></div></div></div>
    <div class="section panel"><div class="subhead"><h3>Career Timeline</h3></div><div class="archive-controls" id="timelineMetricBtns"></div><div id="managerTimeline"></div></div>
    <div class="section panel"><div class="subhead"><h3>Rookie Picks</h3></div><div class="draft-rounds" id="managerPicks"></div></div>
  </section>

  <section class="view" id="drafts">
    <div class="section-head"><h2>Rookie Drafts</h2></div>
    <div class="panel"><div class="toolbar"><label for="draftYear">Year</label><select id="draftYear"></select></div><div class="draft-rounds" id="draftBoard"></div></div>
  </section>
</main>

<footer>Dynasty Plebs • Est. 2019</footer>
<script src="data-v3-01.js"></script>
<script src="data-v3-02.js"></script>
<script src="data-v3-03.js"></script>
<script src="data-v3-04.js"></script>
<script src="data-v3-05.js"></script>
<script src="data-v3-06.js"></script>
<script src="data-v3-07.js"></script>
<script>
  if (!window.__PLEBS_DATA_SRC) throw new Error('Dynasty Plebs data bundle did not load.');
  (0, eval)(window.__PLEBS_DATA_SRC);
  delete window.__PLEBS_DATA_SRC;
</script>
<script src="draft-outcomes.js"></script>
<script src="app-v2.js"></script>
<script src="workbook-extras.js"></script>
<script src="production-upgrade.js"></script>
<script src="regression-fix.js?v=1"></script>
</body>
</html>
