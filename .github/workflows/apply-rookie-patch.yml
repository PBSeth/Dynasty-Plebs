name: Apply Dynasty Plebs data patches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rookie-patch.yml'
      - 'patch_rookies.py'
      - 'career_ppg_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ownership patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patch_rookies.py')
          s=p.read_text()
          old='if s2==s: raise SystemExit("renderDraftIntel not replaced")\np.write_text(s2)'
          new='if s2==s:\n    p.write_text(s)\nelse:\n    p.write_text(s2)'
          if old not in s:
              raise SystemExit('Expected patch_rookies guard not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Correct rookie ownership
        run: python patch_rookies.py
      - name: Build Sleeper-scored career draft outcomes
        run: python career_ppg_patch.py
      - name: Commit updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply Sleeper-scored career draft intel"
            git push
          fi
