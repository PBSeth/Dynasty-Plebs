name: Apply rookie ownership patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rookie-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python patch_rookies.py
      - name: Commit corrected index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Correct rookie ownership and add round-adjusted draft intel"
            git push
          fi
