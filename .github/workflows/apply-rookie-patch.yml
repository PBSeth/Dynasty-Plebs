name: Apply Dynasty Plebs data patches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rookie-patch.yml'
      - 'patch_rookies.py'
      - 'audit_2025_ownership.py'
      - 'career_ppg_patch.py'
      - 'veteran_exclusion_patch.py'
      - 'position_adjusted_draft_grade.py'
      - 'site_ui_patch.py'
      - 'graph_polish_patch.py'
      - 'legacy_score_patch.py'
      - 'final_user_notes_patch.py'
      - 'mobile_round_grid_fix.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare ownership patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('patch_rookies.py')
          s=p.read_text()
          old='if s2==s: raise SystemExit("renderDraftIntel not replaced")\np.write_text(s2)'
          new='if s2==s:\n    p.write_text(s)\nelse:\n    p.write_text(s2)'
          if old not in s:
              raise SystemExit('Expected patch_rookies guard not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Correct rookie ownership
        run: python patch_rookies.py
      - name: Apply canonical 2019-2026 draft archive
        run: python audit_2025_ownership.py
      - name: Audit Sleeper sample stat fields
        run: |
          python - <<'PY'
          import json, urllib.request
          names={'A.J. Brown','Jonathan Taylor','Kyle Pitts'}
          for year in range(2019,2026):
              req=urllib.request.Request(f'https://api.sleeper.com/stats/nfl/{year}?season_type=regular',headers={'User-Agent':'Mozilla/5.0'})
              rows=json.load(urllib.request.urlopen(req,timeout=45))
              for r in rows:
                  p=r.get('player') or {}
                  name=p.get('full_name') or ' '.join(x for x in (p.get('first_name'),p.get('last_name')) if x)
                  if name not in names: continue
                  s=r.get('stats') or {}
                  keep={k:s[k] for k in sorted(s) if (k in {'gp','gms_active','pts_half_ppr','rec','rec_yd','rec_td','rec_2pt','rush_yd','rush_td','rush_2pt','fum_lost','fum_rec_td','kick_ret_td','punt_ret_td'} or '2pt' in k or 'bonus' in k) and s[k]}
                  print(year,name,p.get('position'),keep)
          PY
      - name: Build Sleeper-scored draft outcomes
        run: python career_ppg_patch.py
      - name: Detect and exclude veteran selections
        run: python veteran_exclusion_patch.py
      - name: Apply position-adjusted manager draft grading
        run: python position_adjusted_draft_grade.py
      - name: Apply champions, All-Time ordering, and PF/PA timeline
        run: python site_ui_patch.py
      - name: Polish manager graph readability
        run: python graph_polish_patch.py
      - name: Build exact Dynasty Plebs legacy scores
        run: python legacy_score_patch.py
      - name: Apply recovered final UI and grading instructions
        run: python final_user_notes_patch.py
      - name: Restore compact mobile round grid
        run: python mobile_round_grid_fix.py
      - name: Commit updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add exact Dynasty Plebs legacy scores"
            git push
          fi
