name: Draft-Adjusted PPG research audit

on:
  push:
    branches:
      - pos-adj-ppg-research
    paths:
      - 'research/pos_adj_ppg/**'
      - '.github/workflows/pos-adj-ppg-research.yml'
      - 'career_ppg_patch.py'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: pos-adj-ppg-research

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build identity-cleaned support-aware expectation curve
        run: python research/pos_adj_ppg/build_pos_adj_ppg_curve_v4.py

      - name: Apply frozen curve to complete Plebs draft history
        run: python research/pos_adj_ppg/audit_plebs_application.py

      - name: Finalize position-at-draft audit
        run: python research/pos_adj_ppg/finalize_draft_adjusted_ppg_v2.py

      - name: Count every completed-class rookie outcome
        run: python research/pos_adj_ppg/finalize_draft_adjusted_ppg_v3.py

      - name: Verify generated files
        run: |
          test -s research/pos_adj_ppg/adp_snapshot.json
          test -s research/pos_adj_ppg/source_manifest.json
          test -s research/pos_adj_ppg/pos_adj_ppg_curve.json
          test -s research/pos_adj_ppg/validation_report.md
          test -s research/pos_adj_ppg/draft_adjusted_ppg_audit.csv
          test -s research/pos_adj_ppg/draft_adjusted_ppg.json
          test -s research/pos_adj_ppg/draft-adjusted-ppg.js
          test -s research/pos_adj_ppg/draft_adjusted_ppg_report.md
          python -m json.tool research/pos_adj_ppg/pos_adj_ppg_curve.json >/dev/null
          python -m json.tool research/pos_adj_ppg/draft_adjusted_ppg.json >/dev/null
          grep -Fq 'pos-adj-ppg-v4-research' research/pos_adj_ppg/pos_adj_ppg_curve.json
          grep -Fq 'Career PPG minus the expected Career PPG for a rookie at the same position and draft slot.' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'True rookie outcomes through 2025: **390 / 390**' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'Missing-production rookie picks converted to 0.0: **13**' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'Completed-class rookies still omitted: **0**' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'Seth true rookie outcomes through 2025: **48**' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'Frank Gore Jr.: **0.0 Career PPG and included**.' research/pos_adj_ppg/draft_adjusted_ppg_report.md
          grep -Fq 'draft-adjusted-ppg-v2' research/pos_adj_ppg/draft-adjusted-ppg.js
          git diff --check

      - name: Commit reproducible research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pos_adj_ppg/adp_snapshot.json \
                  research/pos_adj_ppg/source_manifest.json \
                  research/pos_adj_ppg/pos_adj_ppg_curve.json \
                  research/pos_adj_ppg/validation_report.md \
                  research/pos_adj_ppg/plebs_application_audit.csv \
                  research/pos_adj_ppg/plebs_application_report.md \
                  research/pos_adj_ppg/draft_adjusted_ppg_audit.csv \
                  research/pos_adj_ppg/draft_adjusted_ppg.json \
                  research/pos_adj_ppg/draft-adjusted-ppg.js \
                  research/pos_adj_ppg/draft_adjusted_ppg_report.md
          if git diff --cached --quiet; then
            echo "Research artifacts already current."
            exit 0
          fi
          git commit -m "Generate complete Draft-Adjusted PPG rookie outcomes"
          git push origin HEAD:pos-adj-ppg-research
