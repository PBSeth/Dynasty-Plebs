name: Fix Sleeper special teams scoring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-special-td.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scoring and expand screenshot calibration
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('career_ppg_patch.py')
          s=p.read_text()
          old='''        + as_num(s.get("fum_rec_td")) * 6\n        + as_num(s.get("kick_ret_td")) * 6\n        + as_num(s.get("punt_ret_td")) * 6'''
          new='''        + as_num(s.get("fum_rec_td")) * 6\n        + (as_num(s.get("st_td")) if as_num(s.get("st_td")) else as_num(s.get("kick_ret_td")) + as_num(s.get("punt_ret_td"))) * 6'''
          if old in s:
              s=s.replace(old,new,1)
          anchor='''    (2023, "Kyler Murray", 156.36, 8),\n    (2024, "Kyler Murray", 317.24, 17),'''
          expanded='''    (2023, "Kyler Murray", 156.36, 8),\n    (2019, "A.J. Brown", 191.10, 16),\n    (2020, "A.J. Brown", 212.50, 14),\n    (2021, "A.J. Brown", 149.40, 13),\n    (2022, "A.J. Brown", 255.60, 17),\n    (2023, "A.J. Brown", 236.60, 17),\n    (2020, "Jonathan Taylor", 234.80, 15),\n    (2021, "Jonathan Taylor", 353.10, 17),\n    (2022, "Jonathan Taylor", 132.40, 11),\n    (2023, "Jonathan Taylor", 146.90, 10),\n    (2021, "Kyle Pitts", 142.60, 17),\n    (2022, "Kyle Pitts", 61.60, 10),\n    (2023, "Kyle Pitts", 110.80, 17),\n    (2024, "Kyler Murray", 317.24, 17),'''
          if anchor in s:
              s=s.replace(anchor,expanded,1)
          p.write_text(s)
          PY
      - name: Rebuild career outcomes
        run: python career_ppg_patch.py
      - name: Commit scoring fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career_ppg_patch.py index.html
          git commit -m "Fix special teams TD scoring and expand calibration" || exit 0
          git push
