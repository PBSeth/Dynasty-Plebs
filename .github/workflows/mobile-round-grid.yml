name: Apply mobile round grid fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-round-grid.yml'
      - 'mobile_round_grid_fix.py'
      - 'final_user_notes_patch.py'
      - 'index.html'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 2x2 mobile round cards
        run: python mobile_round_grid_fix.py
      - name: Commit mobile layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html final_user_notes_patch.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Restore 2x2 mobile rookie round grid"
            git push
          fi
