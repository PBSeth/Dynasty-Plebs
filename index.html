main{padding:22px 0 52px}.view{display:none}.view.on{display:block}.section{margin-top:28px}.section:first-child{margin-top:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:12px}.section-head h2{margin:0;font:800 clamp(28px,3vw,38px)/1 Georgia,"Times New Roman",serif}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

d #d7c7aa;background:#fff9ed;border-radius:10px;padding:10px}.pick .yr{color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.pick b{display:block;margin-top:3px;font-size:13px}.pick span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #c7b594;border-radius:10px;background:#f4ead8}

<body>

  <div class="section"><div class="section-head"><div><h2>Managers</h2><p>Tap any manager to open the full profile.</p></div></div><div class="manager-board" id="managerBoard"></div></div>

  <div class="panel" id="profile"></div>
  <div class="profile-grid">
    <div class="panel"><div class="subhead"><h3>Season History</h3><p>Team name and regular-season result by year.</p></div><div class="history" id="history"></div></div>
    <div class="panel"><div class="subhead"><h3>Rookie Picks</h3><p>Managerial rookie draft history lives here.</p></div><div class="picks" id="rookiePicks"></div></div>

</main>

];
// Ready for sheet-backed rookie draft entries: { 'Manager Name': [{year:2024,pick:'1.05',player:'Player'}] }
const rookiePicks={};
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const agg=new Map(),history=new Map();
seasons.forEach(s=>s.r.forEach(([m,t,w,l,pf,pa])=>{let x=agg.get(m)||{m,s:0,w:0,l:0,pf:0,pa:0};x.s++;x.w+=w;x.l+=l;x.pf+=pf;x.pa+=pa;agg.set(m,x);if(!history.has(m))history.set(m,[]);history.get(m).push({year:s.y,team:t,w,l,pf,pa})}));
const careers=[...agg.values()].map(x=>({...x,p:x.w/(x.w+x.l),pps:x.pf/x.s}));
const metrics={wins:['Wins',x=>x.w,x=>nf.format(x.w),x=>`${x.w}-${x.l}`],pct:['Win %',x=>x.p,x=>(x.p*100).toFixed(1)+'%',x=>`${x.w}-${x.l}`],pf:['Points For',x=>x.pf,x=>nf.format(x.pf),x=>`${x.s} seasons`],pps:['PF / Season',x=>x.pps,x=>nf.format(x.pps),x=>`${x.s} seasons`]};
let metric='wins';const mb=document.getElementById('metricBtns');Object.entries(metrics).forEach(([k,[label]])=>{const b=document.createElement('button');b.textContent=label;b.className=k===metric?'on':'';b.onclick=()=>{metric=k;[...mb.children].forEach(x=>x.className='');b.className='on';drawChart()};mb.appendChild(b)});
function drawChart(){const [_,get,fmt,sub]=metrics[metric],d=[...careers].sort((a,b)=>get(b)-get(a)||b.s-a.s||b.pf-a.pf).slice(0,12),max=Math.max(...d.map(get));document.getElementById('chart').innerHTML=d.map((x,i)=>`<div class="bar"><div><strong>${i+1}. ${x.m}</strong><small>${sub(x)}</small></div><div class="track"><div class="fill" style="width:${Math.max(4,get(x)/max*100)}%"></div></div><div class="val">${fmt(x)}</div></div>`).join('')}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));document.querySelectorAll('.navtabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navtabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
const board=document.getElementById('managerBoard');[...careers].sort((a,b)=>b.w-a.w||b.p-a.p||b.pf-a.pf).forEach((x,i)=>{const b=document.createElement('button');b.className='manager-card';b.innerHTML=`<span class="rank">#${i+1} all-time wins</span><h3>${x.m}</h3><div class="mini-stats"><div class="mini-stat"><small>Record</small><b>${x.w}-${x.l}</b></div><div class="mini-stat"><small>Win %</small><b>${(x.p*100).toFixed(1)}%</b></div><div class="mini-stat"><small>Seasons</small><b>${x.s}</b></div></div>`;b.onclick=()=>{selectManager(x.m);showView('managers')};board.appendChild(b)});
const select=document.getElementById('managerSelect');[...careers].sort((a,b)=>a.m.localeCompare(b.m)).forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x.m;select.appendChild(o)});select.onchange=()=>renderManager(select.value);
function selectManager(name){select.value=name;renderManager(name)}
function renderManager(name){const x=careers.find(c=>c.m===name),h=[...(history.get(name)||[])].sort((a,b)=>b.year-a.year),latest=h[0];document.getElementById('profile').innerHTML=`<div class="profile-head"><div><h2>${x.m}</h2><p>${x.s} season${x.s===1?'':'s'} in the Dynasty Plebs record</p></div><div class="current-team">${latest?latest.team:''}</div></div><div class="profile-stats"><div class="profile-stat"><small>Career Record</small><b>${x.w}-${x.l}</b></div><div class="profile-stat"><small>Win %</small><b>${(x.p*100).toFixed(1)}%</b></div><div class="profile-stat"><small>Points For</small><b>${nf.format(x.pf)}</b></div><div class="profile-stat"><small>PF / Season</small><b>${nf.format(x.pps)}</b></div></div>`;
document.getElementById('history').innerHTML=h.map(s=>`<div class="history-row"><div class="history-year">${s.year}</div><div class="history-team"><strong>${s.team}</strong><small>${nf.format(s.pf)} PF · ${nf.format(s.pa)} PA</small></div><div class="history-record">${s.w}-${s.l}<small>${((s.w/(s.w+s.l))*100).toFixed(1)}%</small></div></div>`).join('');
const picks=rookiePicks[name]||[];document.getElementById('rookiePicks').innerHTML=picks.length?`<div class="pick-grid">${[...picks].sort((a,b)=>b.year-a.year).map(p=>`<div class="pick"><div class="yr">${p.year} · ${p.pick}</div><b>${p.player}</b>${p.note?`<span>${p.note}</span>`:''}</div>`).join('')}</div>`:`<div class="empty">Rookie-pick history will display here for ${name}.</div>`}
drawChart();selectManager([...careers].sort((a,b)=>b.w-a.w||b.p-a.p)[0].m);
