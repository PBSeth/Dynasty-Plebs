<style>
:root{--bg:#e8deca;--paper:#f7f0e2;--ink:#241e16;--muted:#756a5a;--line:#cdbf9f;--dark:#17130e;--gold:#b78a3d;--red:#7a3023;--green:#416847;--shadow:0 10px 28px rgba(44,31,14,.10);--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.4}button,select{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}

main{padding:22px 0 52px}.view{display:none}.view.on{display:block}.section{margin-top:30px}.section:first-child{margin-top:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:12px}.section-head h2{margin:0;font:800 clamp(28px,3vw,38px)/1 Georgia,"Times New Roman",serif}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}

d #d7c7aa;background:#fff9ed;border-radius:10px;padding:10px;border-left:7px solid var(--pick-color,#b78a3d)}.pick .yr{color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.pick b{display:block;margin-top:3px;font-size:13px}.pick span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #c7b594;border-radius:10px;background:#f4ead8}
footer{padding:8px 0 36px;color:#746958;font-size:11px;text-align:center}
@media(max-width:850px){.fame-grid{grid-template-columns:repeat(2,1fr)}.profile-grid{grid-template-columns:1fr}}
@media(max-width:620px){.wrap{width:min(100% - 16px,1180px)}.headbar{min-height:60px}.brand strong{font-size:18px}.navtabs button{padding:8px 10px}.bar{grid-template-columns:95px 1fr 58px}.bar small{display:none}.fame-grid{grid-template-columns:1fr 1fr}.fame-card{min-height:106px;padding:14px}.fame-card h3{font-size:19px}.manager-toolbar{align-items:stretch;flex-direction:column;gap:6px}.manager-toolbar select{width:100%;min-width:0}.profile-head{align-items:flex-start;flex-direction:column}.current-team{text-align:left}.profile-stats{grid-template-columns:repeat(2,1fr)}.history-row{grid-template-columns:46px 1fr auto}.pick-grid{grid-template-columns:1fr}}

<body>

</section>
<section class="view" id="managers">

  <div class="panel" id="profile"></div>
  <div class="profile-grid">
    <div class="panel"><div class="subhead"><h3>Season History</h3><p>Team name and regular-season result by year.</p></div><div class="history" id="history"></div></div>

</main>

];
const champions=[
 {year:2019,manager:'David Carnes',team:'Turn Down for WATT'},
 {year:2020,manager:'Matthew Piontek',team:"Mott's Applesauce"},
 {year:2021,manager:'Matthew Piontek',team:"Mott's Applesauce"},
 {year:2022,manager:'Seth Miller',team:'The Collector'},
 {year:2023,manager:'Jordan Martin',team:'Team Bad fingers'},
 {year:2024,manager:null,team:null},
 {year:2025,manager:null,team:null}
];
// Draft history hook. Actual sheet rows can be dropped in without changing the UI.
const rookiePicks={};
const managerColors={
 'Seth Miller':'#7a3023','Jordan Martin':'#294f78','Payton Docheff':'#b76f2b','Bo Tiller':'#4f6e3f','Clint Hudson':'#6d547e','Matt Metz':'#a85c32','Travis Page':'#355f6d','Alex Agueros':'#8c6d36','Luke Miller':'#65717d','David Carnes':'#505050','Matt Clawson':'#8a4d54','Matthew Piontek':'#9b7a25','Mason Good':'#476c4c','Kevin Long':'#665643','Tim Bell':'#8d3b32','Ryan Lipkin':'#a56a2a'
};
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const winDec=v=>v.toFixed(3).replace(/^0/,'');
const agg=new Map(),history=new Map();
seasons.forEach(s=>s.r.forEach(([m,t,w,l,pf,pa])=>{let x=agg.get(m)||{m,s:0,w:0,l:0,pf:0,pa:0};x.s++;x.w+=w;x.l+=l;x.pf+=pf;x.pa+=pa;agg.set(m,x);if(!history.has(m))history.set(m,[]);history.get(m).push({year:s.y,team:t,w,l,pf,pa})}));
const careers=[...agg.values()].map(x=>({...x,p:x.w/(x.w+x.l)}));
const metrics={wins:['Wins',x=>x.w,x=>nf.format(x.w),x=>`${x.w}-${x.l}`],pct:['Win %',x=>x.p,x=>winDec(x.p),x=>`${x.w}-${x.l}`],pf:['Points For',x=>x.pf,x=>nf.format(x.pf),x=>`${x.s} seasons`],pa:['Points Against',x=>x.pa,x=>nf.format(x.pa),x=>`${x.s} seasons`]};
let metric='wins';const mb=document.getElementById('metricBtns');Object.entries(metrics).forEach(([k,[label]])=>{const b=document.createElement('button');b.textContent=label;b.className=k===metric?'on':'';b.onclick=()=>{metric=k;[...mb.children].forEach(x=>x.className='');b.className='on';drawChart()};mb.appendChild(b)});
function drawChart(){const [_,get,fmt,sub]=metrics[metric],d=[...careers].sort((a,b)=>get(b)-get(a)||b.s-a.s||b.pf-a.pf).slice(0,12),max=Math.max(...d.map(get));document.getElementById('chart').innerHTML=d.map((x,i)=>`<div class="bar"><div><strong>${i+1}. ${x.m}</strong><small>${sub(x)}</small></div><div class="track"><div class="fill" style="width:${Math.max(4,get(x)/max*100)}%"></div></div><div class="val">${fmt(get(x))}</div></div>`).join('')}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));document.querySelectorAll('.navtabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===id));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navtabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));
const fameGrid=document.getElementById('fameGrid');fameGrid.innerHTML=champions.map(c=>c.manager?`<div class="fame-card"><div class="fame-year">${c.year} Champion</div><h3>${c.manager}</h3><p>${c.team}</p></div>`:`<div class="fame-card pending"><div class="fame-year">${c.year} Champion</div><h3>Sheet result pending</h3></div>`).join('');
const select=document.getElementById('managerSelect');[...careers].sort((a,b)=>a.m.localeCompare(b.m)).forEach(x=>{const o=document.createElement('option');o.value=o.textContent=x.m;select.appendChild(o)});select.onchange=()=>renderManager(select.value);
function renderManager(name){const x=careers.find(c=>c.m===name),h=[...(history.get(name)||[])].sort((a,b)=>b.year-a.year),latest=h[0];document.getElementById('profile').innerHTML=`<div class="profile-head"><div><h2>${x.m}</h2><p>${x.s} season${x.s===1?'':'s'} in the Dynasty Plebs record</p></div><div class="current-team">${latest?latest.team:''}</div></div><div class="profile-stats"><div class="profile-stat"><small>Career Record</small><b>${x.w}-${x.l}</b></div><div class="profile-stat"><small>Win %</small><b>${winDec(x.p)}</b></div><div class="profile-stat"><small>Points For</small><b>${nf.format(x.pf)}</b></div><div class="profile-stat"><small>Points Against</small><b>${nf.format(x.pa)}</b></div></div>`;
document.getElementById('history').innerHTML=h.map(s=>`<div class="history-row"><div class="history-year">${s.year}</div><div class="history-team"><strong>${s.team}</strong><small>${nf.format(s.pf)} PF · ${nf.format(s.pa)} PA</small></div><div class="history-record">${s.w}-${s.l}<small>${winDec(s.w/(s.w+s.l))}</small></div></div>`).join('');
const picks=rookiePicks[name]||[];document.getElementById('rookiePicks').innerHTML=picks.length?`<div class="pick-grid">${[...picks].sort((a,b)=>b.year-a.year||String(a.pick).localeCompare(String(b.pick))).map(p=>`<div class="pick" style="--pick-color:${p.color||managerColors[name]||'#b78a3d'}"><div class="yr">${p.year} · ${p.pick}</div><b>${p.player}</b>${p.note?`<span>${p.note}</span>`:''}</div>`).join('')}</div>`:`<div class="empty">Rookie draft rows for ${name} will populate from the Dynasty Plebs sheet.</div>`}
drawChart();renderManager('Seth Miller');
